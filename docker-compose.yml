version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: clipvault-postgres

    environment:
      POSTGRES_DB: clipvault
      POSTGRES_USER: clipvault
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:

    build:
      context: ./backend

    container_name: clipvault-backend

    command:
    - uvicorn
    - app.main:app
    - --reload
    - --host
    - 0.0.0.0
    - --port
    - "8000"

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://clipvault:password@postgres:5432/clipvault

    volumes:
    - ./backend:/app

    depends_on:
      - postgres

  frontend:

    build:
      context: ./frontend

    container_name: clipvault-frontend

    command:
    - npm
    - run
    - dev
    - --
    - --host

    ports:
      - "5173:5173"

    volumes:
    - ./frontend:/app
    - /app/node_modules

    depends_on:
      - backend

volumes:

  postgres-data: